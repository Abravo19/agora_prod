services:
    # --- Le Serveur Web (Apache + PHP) ---
    www:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - db

    # --- La Base de Données (MariaDB) ---
    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: agora
            MYSQL_USER: app
            MYSQL_PASSWORD: app
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"

    # --- L'interface SQL (PhpMyAdmin) ---
    pma:
        image: phpmyadmin/phpmyadmin
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            UPLOAD_LIMIT: 300M
        depends_on:
            - db
        networks:
            - default
        restart: unless-stopped

volumes:
    db_data:

networks:
    default:
        driver: bridge
